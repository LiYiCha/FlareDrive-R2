<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>404 - 文件或页面不存在 | FlareDrive</title>
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 20px 45px -18px rgba(15, 23, 42, 0.25);
        padding: 40px 32px calc(32px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      .code {
        font-size: clamp(56px, 16vw, 84px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #0f172a 30%, #2563eb);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 18px; margin: 14px 0 8px; }
      p { font-size: 14px; color: #64748b; line-height: 1.7; }
      .actions {
        margin-top: 26px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .primary { background: #0f172a; color: #fff; }
      .primary:hover { background: #1e293b; }
      .ghost { background: #f1f5f9; color: #334155; }
      .ghost:hover { background: #e2e8f0; }
      .tip { margin-top: 18px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>页面走丢了</h1>
      <p>你访问的文件或页面不存在，可能已被移动或删除。<br />2 秒后自动返回网盘首页。</p>
      <div class="actions">
        <a class="primary" href="/">返回首页</a>
        <a class="ghost" href="javascript:history.back()">返回上一页</a>
      </div>
      <p class="tip">FlareDrive-R2 · Cloudflare R2 边缘网盘</p>
    </main>
    <script>
      setTimeout(function () {
        window.location.replace("/");
      }, 2000);
    </script>
  </body>
</html>
