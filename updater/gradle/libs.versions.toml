# ============================================================================
# Updater — 依赖版本集中管理
# ============================================================================
# 改这里的版本号，全局生效。build.gradle.kts 用 alias 引用。
# 详细用法参见：https://docs.gradle.org/current/userguide/version_catalogs.html
# ============================================================================

[versions]
# 构建工具
agp            = "8.5.0"
kotlin         = "2.0.21"
ksp            = "2.0.21-1.0.26"
composeCompiler = "1.5.14"   # Kotlin 2.0 → Compose Compiler 1.5.14

# SDK / JDK
compileSdk     = "36"
minSdk         = "24"
jvmTarget      = "17"

# AndroidX
coreKtx              = "1.13.1"
activityCompose      = "1.9.2"
lifecycleViewmodel   = "2.8.6"

# Kotlin
coroutines           = "1.8.1"
serialization        = "1.7.3"

# 网络
okhttp               = "4.12.0"
retrofit             = "2.11.0"

# 持久化
room                 = "2.6.1"
datastore            = "1.1.1"

# UI — Compose
composeBom           = "2024.10.00"
material3            = "1.3.0"
accompanist          = "0.34.0"

# 后台
work                 = "2.9.1"

[libraries]
# AndroidX
androidx-core-ktx          = { group = "androidx.core", name = "core-ktx",                    version.ref = "coreKtx" }
androidx-activity-compose  = { group = "androidx.activity", name = "activity-compose",        version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodel" }

# Compose (BOM 管理，子依赖不写版本)
compose-bom              = { group = "androidx.compose",          name = "compose-bom",    version.ref = "composeBom" }
compose-ui               = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics      = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling       = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3        = { group = "androidx.compose.material3", name = "material3",      version.ref = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
accompanist-swiperefresh = { group = "com.google.accompanist",         name = "accompanist-swiperefresh", version.ref = "accompanist" }

# Kotlin
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",  version.ref = "serialization" }

# 网络
okhttp             = { group = "com.squareup.okhttp3",    name = "okhttp",                              version.ref = "okhttp" }
okhttp-logging     = { group = "com.squareup.okhttp3",    name = "logging-interceptor",                 version.ref = "okhttp" }
retrofit           = { group = "com.squareup.retrofit2", name = "retrofit",                            version.ref = "retrofit" }
retrofit-kotlinx   = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization",     version.ref = "retrofit" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application    = { id = "com.android.application",                       version.ref = "agp" }
android-library        = { id = "com.android.library",                          version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",                  version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose",          version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp",                       version.ref = "ksp" }

[bundles]
# Compose 全家桶（可选）
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-material3"
]
